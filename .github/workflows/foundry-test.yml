# Builds a small stand-alone test of Foundry Local (spikes/foundry-local-test) for Windows.
# It is not Mimer and shares nothing with it. Run it by hand: Actions > "Foundry Local test" >
# Run workflow. The result is two artifacts (x64 and arm64), each a folder to unzip and run.
name: Foundry Local test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Add the Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Build the test program
        working-directory: spikes/foundry-local-test
        shell: pwsh
        env:
          # The runtime package (native engine, ONNX Runtime, WinML) is downloaded while building.
          FOUNDRY_LOCAL_RUNTIME_VERSION: "2.1.0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect the program and its libraries in one folder
        shell: pwsh
        run: |
          $out = "foundry-local-test-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          $target = "spikes/foundry-local-test/target/${{ matrix.target }}/release"
          Copy-Item "$target/foundry-local-test.exe" $out
          # The native libraries the build downloaded sit in the SDK's build output.
          Get-ChildItem "$target/build" -Recurse -Filter *.dll |
            Where-Object { $_.FullName -match 'foundry-local-sdk-[0-9a-f]+[\\/]out[\\/]' } |
            Copy-Item -Destination $out
          Copy-Item spikes/foundry-local-test/README-TEST.txt $out
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name ($_.Length / 1MB) "MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: foundry-local-test-${{ matrix.arch }}
          path: foundry-local-test-${{ matrix.arch }}
          if-no-files-found: error
