name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mimer ${{ github.ref_name }}"
          releaseBody: "Beta version. See CHANGELOG.md for what changed. The Windows installer (`*-setup.exe`) installs per user without administrator rights. Builds are unsigned."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      # The Microsoft Store package (see docs/MSIX.md). It must never fail the release, so any
      # problem here only shows up as a failed step.
      - name: Build the Microsoft Store package (MSIX)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/msix/Build-Msix.ps1 -Version "${{ github.ref_name }}" `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'Jkielsgaard.Mimer' }}" `
            -DisplayName "${{ vars.MSIX_DISPLAY_NAME || 'Mimer: Markdown Notes' }}" `
            -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=00000000-0000-0000-0000-000000000000' }}" `
            -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Jesper Ahasverusen Kielsgaard' }}" `
            -TestSign

      # The same package, but one that may download the built-in AI engine. Its own folder, so the
      # two sets of files and certificates never mix.
      - name: Build the Microsoft Store package with the built-in AI (MSIX)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/msix/Build-Msix.ps1 -Version "${{ github.ref_name }}" -OutDir msix-out-ai -BuiltInAi `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'Jkielsgaard.Mimer' }}" `
            -DisplayName "${{ vars.MSIX_DISPLAY_NAME || 'Mimer: Markdown Notes' }}" `
            -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=00000000-0000-0000-0000-000000000000' }}" `
            -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Jesper Ahasverusen Kielsgaard' }}" `
            -TestSign

      - name: Keep the Microsoft Store package
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mimer-msix
          path: |
            msix-out/Mimer_*_x64.msix
          if-no-files-found: warn

      # The copy for trying the package on a test Windows (Sandbox or a virtual machine), signed
      # with a throw-away certificate that is NOT valid in the Store. See docs/MSIX.md.
      - name: Keep the test copy of the Microsoft Store package
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mimer-msix-test
          path: |
            msix-out/*_test.msix
            msix-out/mimer-test.cer
            msix-out/Install-TestMsix.ps1
          if-no-files-found: warn

      - name: Keep the Microsoft Store package with the built-in AI
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mimer-msix-with-ai
          path: |
            msix-out-ai/Mimer_*_x64_with-ai.msix
          if-no-files-found: warn

      - name: Keep the test copy of the Microsoft Store package with the built-in AI
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mimer-msix-with-ai-test
          path: |
            msix-out-ai/*_with-ai_test.msix
            msix-out-ai/mimer-test.cer
            msix-out-ai/Install-TestMsix.ps1
          if-no-files-found: warn
