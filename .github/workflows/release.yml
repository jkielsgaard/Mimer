name: Release

on:
  push:
    tags:
      - "v*"

# Two editions share this workflow (see docs/DECISIONS.md, "Stable and Preview"):
#   Preview: a tag like v0.20.0 or v1.1.0-preview.2 (no approval needed). A tag with a "-" builds
#            as "Mimer Preview" (its own app identity, so it can stand next to Stable) and makes no
#            Microsoft Store package. Until v1.0.0 exists the Store has no Stable to show, so a
#            0.x tag still builds as "Mimer" with the Store package, and the Store keeps its settings.
#   Stable:  a plain tag like v1.0.0. Builds as "Mimer" and makes the Store package. The job waits
#            for the owner's approval (the GitHub environment "stable" has a required reviewer), so
#            a tag pushed by mistake cannot build a Stable release.
jobs:
  release:
    permissions:
      contents: write
    environment: ${{ (startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-')) && 'preview' || 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The tag must be a version and must be the version in package.json, so a wrong tag stops here.
      - name: Check the tag and choose the edition
        id: edition
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "The tag $tag is not a version such as v1.0.0 or v1.1.0-preview.1."; exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "v$pkg" != "$tag" ]; then
            echo "The tag $tag does not match the version $pkg in package.json."; exit 1
          fi
          if [[ "$tag" == v0.* || "$tag" == *-* ]]; then
            echo "name=preview" >> "$GITHUB_OUTPUT"
          else
            echo "name=stable" >> "$GITHUB_OUTPUT"
          fi
          # Only a pre-release tag gets its own identity. A 0.x tag keeps "Mimer" for now.
          if [[ "$tag" == *-* ]]; then
            echo "args=--config src-tauri/tauri.preview.conf.json" >> "$GITHUB_OUTPUT"
            echo "store=false" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == v0.* ]]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "store=true" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "store=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Foundry Local's native libraries are packed into the installer, the AppImage and the Store
      # package (src-tauri/foundry-native). A failure here stops the release on purpose: a build
      # without them would silently have no Foundry Local.
      - name: Fetch Foundry Local's native libraries (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: ./scripts/fetch-foundry-native.sh

      - name: Fetch Foundry Local's native libraries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-foundry-native.ps1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The AppImage tool follows the libraries' dependencies; Foundry Local's sit in this folder.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/foundry-native
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mimer ${{ steps.edition.outputs.name == 'preview' && 'Preview' || 'Stable' }} ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed. The Windows installer (`*-setup.exe`) installs per user without administrator rights. Builds are unsigned."
          releaseDraft: true
          # Preview releases (0.x and tags with a pre-release part) are marked as pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          args: ${{ steps.edition.outputs.args }}

      # The Microsoft Store package (see docs/MSIX.md). It must never fail the release, so any
      # problem here only shows up as a failed step.
      - name: Build the Microsoft Store package (MSIX)
        if: matrix.platform == 'windows-latest' && steps.edition.outputs.store == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/msix/Build-Msix.ps1 -Version "${{ github.ref_name }}" `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'Jkielsgaard.Mimer' }}" `
            -DisplayName "${{ vars.MSIX_DISPLAY_NAME || 'Mimer: Markdown Notes' }}" `
            -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=00000000-0000-0000-0000-000000000000' }}" `
            -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Jesper Ahasverusen Kielsgaard' }}" `
            -TestSign
        env:
          # Microsoft's key for Phi Silica; written into the package only (see docs/MSIX.md).
          PHI_SILICA_TOKEN: ${{ secrets.PHI_SILICA_TOKEN }}
          PHI_SILICA_ATTESTATION: ${{ secrets.PHI_SILICA_ATTESTATION }}

      # The test copy is installed by hand, so it carries the Windows App SDK runtime the Store
      # would otherwise install (taken from Microsoft's NuGet package of the same version).
      - name: Add the Windows App SDK runtime to the test copy
        if: matrix.platform == 'windows-latest' && steps.edition.outputs.store == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $nupkg = "winappsdk-runtime.zip"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.windowsappsdk.runtime/2.5.1/microsoft.windowsappsdk.runtime.2.5.1.nupkg" -OutFile $nupkg
          Expand-Archive $nupkg -DestinationPath winappsdk-runtime -Force
          Copy-Item "winappsdk-runtime/tools/MSIX/win10-x64/Microsoft.WindowsAppRuntime.2.msix" msix-out/

      - name: Keep the Microsoft Store package
        if: matrix.platform == 'windows-latest' && steps.edition.outputs.store == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mimer-msix
          path: |
            msix-out/Mimer_*_x64.msix
          if-no-files-found: warn

      # The copy for trying the package on a test Windows (Sandbox or a virtual machine), signed
      # with a throw-away certificate that is NOT valid in the Store. See docs/MSIX.md.
      - name: Keep the test copy of the Microsoft Store package
        if: matrix.platform == 'windows-latest' && steps.edition.outputs.store == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mimer-msix-test
          path: |
            msix-out/*_test.msix
            msix-out/mimer-test.cer
            msix-out/Microsoft.WindowsAppRuntime.2.msix
            msix-out/Install-TestMsix.ps1
          if-no-files-found: warn
