name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The Rust build embeds the frontend, so it must exist.
      - run: pnpm build

      - run: pnpm check

      - name: Bindings are up to date
        run: git diff --exit-code src/bindings

  # The built-in AI has Windows-only code (a job object, PowerShell calls). This only compiles and
  # lints it on Windows, so a mistake there shows up here and not first in a release build.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The Rust build embeds the frontend, so it must exist.
      - run: pnpm build

      - name: Compile and lint the Rust code on Windows
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The Microsoft Store package: pack a stand-in program with the real manifest and logos and
      # sign it with a test certificate. makeappx rejects a manifest that is wrong, so a mistake in
      # the manifest or the script shows up here and not at the first release.
      - name: Check the Microsoft Store package script
        shell: pwsh
        run: |
          ./scripts/msix/Build-Msix.ps1 -Version 0.0.1 -Exe "$env:SystemRoot\System32\notepad.exe" -TestSign
          Get-ChildItem msix-out -Filter *.msix | ForEach-Object { Write-Host $_.Name $_.Length }
          ./scripts/msix/Build-Msix.ps1 -Version 0.0.1 -Exe "$env:SystemRoot\System32\notepad.exe" -OutDir msix-out-ai -BuiltInAi -TestSign
          if (-not (Test-Path msix-out-ai\Mimer_0.0.1.0_x64_with-ai.msix)) { throw "the package with the built-in AI was not made" }
          Get-ChildItem msix-out-ai -Filter *.msix | ForEach-Object { Write-Host $_.Name $_.Length }
