[package]
name = "mimer"
version = "0.6.0"
description = "Markdown notes with a built-in, local-first AI assistant"
authors = ["Jesper Ahasverusen Kielsgaard"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mimer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
docx-rs = "0.4.22"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
git2 = { version = "0.21.0", features = ["vendored-libgit2"], default-features = false }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.3", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
zip = "9.0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
