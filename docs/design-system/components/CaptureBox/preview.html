<!-- @dsCard group="Forms" height=230 subtitle="Writing one thing down" -->
<div class="m-root">
  <div class="m-card m-dialog">
    <span class="close"
      ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg
    ></span>
    <h3>New task</h3>
    <p class="m-muted" style="margin: 0">Goes into the epic you choose, in your task list.</p>
    <input class="m-input" placeholder="What needs doing?" />
    <div class="m-row m-small m-muted" style="flex-wrap: nowrap">
      Into
      <select class="m-input" style="height: 28px">
        <option>Weekly with Mette · this meeting</option>
      </select>
    </div>
    <div class="m-row">
      <span class="m-small m-muted" style="flex: 1">+ Add a note</span
      ><button class="m-btn primary sm">Save task</button>
    </div>
  </div>
</div>
