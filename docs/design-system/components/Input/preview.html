<!-- @dsCard group="Forms" height=150 subtitle="Text fields" -->
<div class="m-root" style="max-width: 420px">
  <label class="m-label" for="t">Title</label
  ><input id="t" class="m-input" placeholder="Weekly with Mette" />
  <div class="m-row" style="flex-wrap: nowrap">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span class="m-label">Time</span><input class="m-input" value="2:30 PM" />
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span class="m-label">With</span><input class="m-input" placeholder="Mette, Peter" />
    </div>
  </div>
  <textarea
    class="m-input"
    rows="3"
    placeholder="A small note. Press Ctrl+Enter to save."
  ></textarea>
</div>
