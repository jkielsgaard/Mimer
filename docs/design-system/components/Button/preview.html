<div class="m-root">
  <div class="m-row">
    <button class="m-btn primary">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg> New
      epic
    </button>
    <button class="m-btn outline">Fold all</button>
    <button class="m-btn ghost">Cancel</button>
    <button class="m-btn destructive">Delete</button>
    <button class="m-btn outline sm">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17 3l4 4L8 20H4v-4L17 3z" />
      </svg>
      Change…
    </button>
    <button class="m-btn ghost icon" aria-label="More for this note">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      </svg>
    </button>
    <button class="m-btn primary" disabled>Save task</button>
  </div>
</div>
