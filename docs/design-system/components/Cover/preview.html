<style>
  .cv {
    position: relative;
    width: 960px;
    height: 288px;
    background: var(--background);
    overflow: hidden;
    font-family: var(--font-sans);
  }
  .cv svg {
    position: absolute;
    left: 0;
    top: 0;
  }
  .b-primary {
    fill: var(--primary);
  }
  .b-accent {
    fill: var(--accent);
  }
  .b-sidebar {
    fill: var(--sidebar);
  }
  .b-ink {
    fill: var(--foreground);
  }
  .b-card {
    fill: var(--card);
  }
  .b-muted {
    fill: var(--muted-foreground);
  }
  .b-success {
    fill: var(--success);
  }
  .line {
    fill: var(--border);
  }
  .name {
    position: absolute;
    left: 40px;
    bottom: 40px;
    width: 420px;
  }
  .name h1 {
    margin: 0;
    font-size: 120px;
    line-height: 0.92;
    font-weight: 700;
    color: var(--foreground);
    letter-spacing: -0.02em;
  }
  .name p {
    margin: 12px 0 0;
    font-size: 14px;
    line-height: 20px;
    color: var(--muted-foreground);
  }
</style>

pattern: "dense UI, rows and checklists" -> list rows: a 18px checkbox (radius 5px like m-check) and a pill (radius-full) at the space-2 pitch
steps and radii: space-2, space-3, space-4, space-5; radius-md, radius-lg, radius-full
